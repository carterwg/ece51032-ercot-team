[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ece51032-team-strategy"
version = "0.1.0"
description = "Team strategy framework around the unchanged ERCOT course evaluator"
requires-python = ">=3.11"
dependencies = ["ercot-game>=0.3,<0.4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
plot = ["matplotlib>=3.8,<4"]
notebook = [
    "pandas>=2,<4",
    "matplotlib>=3.8,<4",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<1",
    "ipykernel>=6,<8",
    "jupyterlab>=4,<5",
]

[project.scripts]
team-strategy = "team_strategy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "ercot-connection-game/src", "ercot-connection-game"]
